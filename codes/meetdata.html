<body>
    <container>

        <div class="containergroot">
            <div class = "h3"><h3>Statische meetdata</h3></div>
            <div id="stat-list">Loading…</div>
            <script>
                async function loadStat() {
                    try {
                    const res = await fetch('http://127.0.0.1:8000/stat');
                    const data = await res.json();
                    const html = data.map(stat => `
                        <div class="data-item">
                        <strong>Bat UID:</strong> ${stat.batUID}<br>
                        <strong>Timestamp:</strong> ${stat.timestamp}<br>
                        <strong>RawData:</strong> ${stat.rawData || '/'}
                        <strong>Estimation:</strong> ${stat.estimation || '/'}
                        <strong>Comment:</strong> ${stat.comment || '/'}
                        </div>
                    `).join('');
                    document.getElementById('stat-list').innerHTML = html || '<p>No batteries found</p>';
                    } catch (e) {
                    document.getElementById('stat-list').innerHTML = `<p style="color:red;">Error: ${e.message}</p>`;
                    }
                }
                loadStat();
            </script>
        </div>
        <a href="../popUp/StatAdd.html" target="_blank" rel="noreferrer"><span class= "plus">✚</span></a>
    
    
    
        <div class="containergroot">
            <div class = "h3"><h3>Wedstrijd meetdata</h3></div>
            <div id="wed-list">Loading…</div>
            <script>
                async function loadWed() {
                    try {
                    const res = await fetch('http://127.0.0.1:8000/wed');

                    const html = data.map(wed => `

                        <strong>Auto UID:</strong> ${wed.autoUID}<br>
                        <strong>Bat UID:</strong> ${wed.batUID}<br>
                        <strong>Time stamp:</strong> ${wed.timestamp || '/'}
                        <strong>RawData:</strong> ${wed.rawData || '/'}

                        </div>
                    `).join('');

                    } catch (e) {

                    }
                }
                loadWed();
            </script>
        </div>

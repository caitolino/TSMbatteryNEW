<body>
    <container>
        <div class="containergroot">
            <div class="titleplus">
                <div class = "h3"><h3>Alle gebruikers</h3></div>
                <a href="../popUp/UserAdd.html" target="_blank" rel="noreferrer"><span class="plus">✚</span></a>
            </div>
            <div id="user-list">Loading…</div>
            <script>
                async function loadusers() {
                    try {
                    const token = localStorage.getItem('token');
                    if (!token) {
                        document.getElementById('user-list').innerHTML = `<p style="color:red;">Not authenticated. <a href="../popUp/login.html">Log in</a></p>`;
                        throw new Error('No token present');
                    }
                    const res = await fetch('http://127.0.0.1:8000/user', {
                      headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                      }
                    });
                    const data = await res.json();
                    if (!res.ok) {
                      throw new Error(data.detail || JSON.stringify(data));
                    }
                    if (!Array.isArray(data)) {
                      throw new Error('Expected array data from /user');
                    }
                    const html = data.map(u => `
                        <div class="data-item">
                        <strong>Battery UID:</strong> ${u.batUID}<br>
                        <strong>Created:</strong> ${u.createdAt}<br>
                        <strong>Retired:</strong> ${u.retiredAt}<br>
                        <strong>User:</strong> ${u.user}<br>
                        <strong>Comment:</strong> ${u.comment || '/'}
                        </div>
                    `).join('');
                    document.getElementById('user-list').innerHTML = html || '<p>No users found</p>';
                    } catch (e) {
                    document.getElementById('user-list').innerHTML = `<p style="color:red;">Error: ${e.message}</p>`;
                    }
            
                loadusers();
            </script>
        </div>
    </container>
</body>

<body>
    <container>
        <div class="containergroot">
            <div class = "h3"><h3>Alle aangemaakte batterijen</h3></div>
            <div id="user-list">Loading…</div>
            <script>
                async function loadUsers() {
                    try {
                    const res = await fetch('http://127.0.0.1:8000/user');
                    const data = await res.json();
                    const html = data.map(b => `
                        <div class="data-item">
                        <strong>Gebruikersnaam:</strong> ${b.username}<br>
                        <strong>Paswoord:</strong> ${b.password}<br>
                        </div>
                    `).join('');
                    document.getElementById('user-list').innerHTML = html || '<p>No batteries found</p>';
                    } catch (e) {
                    document.getElementById('userlist').innerHTML = `<p style="color:red;">Error: ${e.message}</p>`;
                    }
                }
                loadUsers();
            </script>
        </div>
        <a href="../popUp/UserAdd.html" target="_blank" rel="noreferrer"><span class= "plus">✚</span></a>

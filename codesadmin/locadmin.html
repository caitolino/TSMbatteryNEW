<body>
    <div class="containergroot">
        <div class="titleplus">
            <div class = "h3"><h3>Alle aangemaakte locaties/karts</h3></div>
             <a href="../popUp/LocationAdd.html" target="_blank" rel="noreferrer"><span class= "plus">✚</span></a>
        </div>
        <div id="loc">Loading…</div>
        <script>
            fetch('http://127.0.0.1:8000/loc')
                .then(r => r.json())
                .then(data => {
                const html = data.map(item => `
                    <div class="data-item">
                    <strong>Location UID:</strong> ${item.locatieUID}<br>
                    <strong>Type:</strong> ${item.type}<br>
                    <strong>Comment:</strong> ${item.comment}
                    </div>
                `).join('');
                document.getElementById('loc').innerHTML = html || '<p>No locations found</p>';
                })
                .catch(err => { document.getElementById('loc').innerHTML = `<p style="color:red;">Error: ${err}</p>`; });
        
        </script>
    </div>
    
</body>

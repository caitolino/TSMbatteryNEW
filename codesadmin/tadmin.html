<body>
    <div class="containergroot">
        <div class = "h3"><h3>Alle aangemaakte tags</h3></div>
        <div class="containergroot">
        <a style="color:#DDAED3"><label for="cars">Filter:</label>
        <select name="type" id="lk">
        <option value="geen">geen</option>
        <option value="locatie">locatie</option>
        <option value="kart">kart</option>
        <option value="batterij">batterij</option>
        </select>
        </a>
    </div>
        <div id="tags-list">Loading…</div>
        <div id="tags-container"></div>

<script>
const token = localStorage.getItem('token');
if (!token) {
  document.getElementById('tags-container').innerHTML = `<p style="color:red;">Not authenticated. <a href="../popUp/login.html">Log in</a></p>`;
  throw new Error('No token present');
}
fetch('http://127.0.0.1:8000/tags', {
  headers: {
    'Authorization': `Bearer ${token}`,
    'Content-Type': 'application/json'
  }
})
  .then(r => r.json().then(data => ({ok: r.ok, data})))
  .then(({ok, data}) => {
    if (!ok) throw new Error(data.detail || JSON.stringify(data));
    if (!Array.isArray(data)) throw new Error('Expected array data from /tags');
    console.log('Data loaded:', data); 
    window.allItems = data;

    const renderItems = (filter) => {
      let filteredData = data;
      if (filter === 'locatie') {
        filteredData = data.filter(tag => tag.assignmentType === 'locatie' || tag.assignmentType === 'locaties/autos');
      } else if (filter === 'kart') {
        filteredData = data.filter(tag => tag.assignmentType === 'kart');
      } else if (filter === 'batterij') {
        filteredData = data.filter(tag => tag.assignmentType === 'batterij' || tag.assignmentType === 'batterijen');
      }

      console.log('Filtered data for', filter, ':', filteredData);
      const html = (Array.isArray(filteredData) ? filteredData : []).map(tag => {
        const assignments = Array.isArray(tag.assignments) ? tag.assignments : [];
        const assignmentsHtml = assignments.length
          ? assignments.map(a => `
              <div class="assignment-item">
                <strong>Assigned ID:</strong> ${a.assignedId}<br>
                <strong>Valid From:</strong> ${a.validFrom}<br>
                <strong>Valid To:</strong> ${a.validTo}
                </div>
            `).join('')
          : 'None';

        return `
          <div class="data-item">
            <strong>Tag ID:</strong> ${tag.tagId}<br>
            <strong>Type:</strong> ${tag.assignmentType}<br>
            <strong>Status:</strong> ${tag.active ? 'Active' : 'Inactive'}<br>
            <strong>Assignments:</strong>
            <a href="../popUp/AssignAdd.html" target="_blank" rel="noreferrer"><span class="tagassign">✚</span></a><br>

            ${assignmentsHtml}
          </div>
        `;
      }).join('');
      document.getElementById('tags-container').innerHTML = html || '<p>No tags found</p>';
    };

    renderItems('geen');
    document.getElementById('lk').addEventListener('change', (event) => {
      console.log('Select changed to:', event.target.value); 
      renderItems(event.target.value);
    });
  })
  .catch(err => { 
    console.error('Error:', err); 
    document.getElementById('tags-container').innerHTML = `<p style="color:red;">Error: ${err}</p>`; 
  });
</script>

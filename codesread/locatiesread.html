<body>
    <div class="containergroot">
        <div class = "h3"><h3>Alle aangemaakte locaties/karts</h3></div>
        
        <div id="loc">Loading…</div>
        <script>
            const token = localStorage.getItem('token');
            fetch('http://127.0.0.1:8000/loc', {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
                .then(r => r.json().then(data => ({ok: r.ok, data})))
                .then(({ok, data}) => {
                    if (!ok) throw new Error(data.detail || JSON.stringify(data));
                    if (!Array.isArray(data)) throw new Error('Expected array data from /loc');
                    console.log('Data loaded:', data);
                    window.allItems = data;

                    const renderItems = (filter) => {
                        let filteredData = data;
                        if (filter === 'locatie') {
                            filteredData = data.filter(l => l.type === 'locatie');
                        } else if (filter === 'kart') {
                            filteredData = data.filter(l => l.type === 'kart');
                        }

                        console.log('Filtered data for', filter, ':', filteredData); // Debug: check filtering
                        const html = filteredData.map(l => `
                            <div class="data-item">
                            <strong>Location UID:</strong> ${l.locatieUID}<br>
                            <strong>Type:</strong> ${l.type}<br>
                            <strong>User:</strong> ${l.user}<br>
                            <strong>Comment:</strong> ${l.comment}
                            </div>
                        `).join('');
                        document.getElementById('loc').innerHTML = html || '<p>No locations found</p>';
                    };

                    renderItems('geen');
                    document.getElementById('lk').addEventListener('change', (event) => {
                        console.log('Select changed to:', event.target.value); // Debug: check select changes
                        renderItems(event.target.value);
                    });
                })
                .catch(err => { 
                    console.error('Error:', err); // Debug: check for fetch errors
                    document.getElementById('loc').innerHTML = `<p style="color:red;">Error: ${err}</p>`; 
                });
        </script>
        
    </div>
    
    <div class="containergroot">
        <a style="color:#DDAED3"><label for="cars">Filter:</label>
        <select name="locatie/kart" id="lk">
        <option value="geen">geen</option>
        <option value="locatie">locatie</option>
        <option value="kart">kart</option>
        </select>
        </a>
    </div>

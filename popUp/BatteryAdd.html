<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToevoegenBatterij</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<style>body{background-color: #EEEEEE;#EEEEEE;background-image: url(../img/bb.jpeg.png);}</style>
<body>
  <div class="form">
    <form action="http://127.0.0.1:8000/bat" method="POST">
      <H2>Batterij</H2>
      <label for="createdAt">gecreëerd op:</label><br>
      <input type="text" name="createdAt" placeholder="d-m-j, u:m" required /><br>
      <label for="retiredAt">stopgezet op:</label><br>
      <input type="text" name="retiredAt" placeholder="d-m-j, u:m" required /><br>
      <label for="batUID">naam:</label><br>
      <input type="text" name="batUID" placeholder="batUID" required /><br>
      <label for="comment">commentaar:</label><br>
      <input type="text" name="comment" placeholder="/" required /><br>
      <p><button type="submit">submit!</button></p>
    </form>
  </div>
</body>
</html>

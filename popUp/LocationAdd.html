<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToevoegenLocatie</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<style>body{background-color: #EEEEEE;}</style>
<body>
  <div class="form">
    <form action="http://127.0.0.1:8000/loc" method="POST">
      <H2>LOCATIE</H2>
      <label for="type">kart of locatie?:</label><br>
      <input type="text" name="type" placeholder="kart/locatie" required/><br>
      <label for="name">naam:</label><br>
      <input type="text" name="name" placeholder="naam" required/><br>
      <label for="comment">commentaar:</label><br>
      <input type="text" name="comment" placeholder="/" required/><br>
      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>

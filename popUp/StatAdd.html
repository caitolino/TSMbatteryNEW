<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statische data</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<style>body{background-color: #EEEEEE;background-image: url(../img/bb.jpeg.png);}</style>
<body>
  <div class="form">
    <form action="http://127.0.0.1:8000/stat" method="POST">
      <H2>STATISCHE DATA</H2>
      <label for="batUID">batterij id:</label><br>
      <input type="text" name="batUID" placeholder="id" required/><br>
      <label for="timestamp">moment:</label><br>
      <input type="text" name="timestamp" placeholder="d-m-jjjj, u:mm" required/><br>
      <label for="rawData">meet data:</label><br>
      <input type="text" name="rawData" placeholder="{volt: u, current: i}" required/><br>
      <label for="estimation">schatting:</label><br>
      <input type="text" name="estimation" placeholder="0" required/><br>
      <label for="comment">commentaar:</label><br>
      <input type="text" name="comment" placeholder="/" required/><br>
      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>

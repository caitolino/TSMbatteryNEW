<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leerkracht Login</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<style>body{background-color: #EEEEEE;}</style>
<body>
    <div id="logincontainer">
        <div class="form">
            <form id="adminLoginForm" action="#" method="POST">
                <H2>ADMIN LOGIN</H2>
                <label for="username">username:</label><br>
                <input type="text" name="username" placeholder="naam" required /><br>
                <label for="password">password:</label><br>
                <input type="password" name="password" placeholder="password" required /><br>
                <p><button type="submit">submit!</button></p>
            </form>
        </div>
    </div>


    <script>
        const form = document.getElementById("adminLoginForm");
        form.addEventListener("submit", async e => {
            e.preventDefault();
            const f = e.target;
            const resp = await fetch("http://127.0.0.1:8000/login", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                    username: f.username.value,
                    password: f.password.value
                })
            });
            const data = await resp.json();
            if (resp.ok) {
                if (!data.admin) {
                    alert("You are not an admin!");
                    return;
                }

                const token = btoa(`${f.username.value}:${f.password.value}`);
                localStorage.setItem('credentials', token);
                localStorage.setItem("loggedInUser", f.username.value);

                location.href = "../codesadmin/leerlingen.html";
            } else {
                alert("Login failed: " + (data.detail || resp.statusText));
            }
        });
    </script>

</body>

</html>

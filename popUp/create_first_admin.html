<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create First Admin</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div id="logincontainer">
        <div class="form">
            <form id="createAdminForm" action="#" method="POST">
                <H2>CREATE FIRST ADMIN</H2>
                <p>Enter an existing username to make them an admin.</p>
                <label for="username">username:</label><br>
                <input type="text" name="username" placeholder="naam" required /><br>
                <p><button type="submit">Make Admin</button></p>
                <p>
                    <a href="./login.html">Back to login</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById("createAdminForm");
        form.addEventListener("submit", async e => {
            e.preventDefault();
            const f = e.target;
            const resp = await fetch("http://127.0.0.1:8000/admin/create-first", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                    username: f.username.value
                })
            });
            const data = await resp.json();
            if (resp.ok) {
                alert(data.message);
                location.href = "./admin_login.html";
            } else {
                alert("Error: " + (data.detail || resp.statusText));
            }
        });
    </script>

</body>
</html>

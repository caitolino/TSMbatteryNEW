<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../styles.css">
    <!-- comment -->
</head>
<style>body{background-color: #EEEEEE;background-image: url(../img/bglog.jpg);}</style>
<body>
    <div class="form">
        <form id="registerForm" action="http://127.0.0.1:8000/register" method="POST">
        <H2>Register</H2>
        <label for="username">gebruikersnaam:</label><br>
        <input type="text" name="username" placeholder="naam" required/><br>
        <label for="password">paswoord:</label><br>
        <input type="text" name="password" placeholder="paswoord" required/><br>
        <button type="submit">Submit</button>
        </form>
    </div>
    
    
    
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();                       // don’t let the browser navigate
            const form = this;
            const data = new FormData(form);   
            fetch(form.action, {
                method: form.method,
                body: data
            }).then(response => {
                if (response.ok) {
                    // change the path to wherever batteriesread.html lives
                    window.location.href = '../codesread/batteriesread.html';
                } else {
                    return response.text().then(txt => { throw new Error(txt); });
                }
            }).catch(err => {
                alert('Registration failed: ' + err.message);
            });
        });
    </script>
    </body>
</html>
